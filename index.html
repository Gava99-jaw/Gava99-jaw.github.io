    "Мораль: не ищи мораль там, где её нет.",
    "Спасибо, что не смеялись слишком громко.",

used = set()
counter = 0

# ============================================================
#                       ЛОГИКА
# ============================================================

def generate_joke(event=None):
    global counter
    box = document.getElementById("joke-box")
    cnt = document.getElementById("counter")
    tag_filter = document.getElementById("tag-filter").value

    pool = [j for j in BASE if not tag_filter or j[2] == tag_filter]
    if not pool:
        box.innerHTML = "<div class='setup'>Под этот фильтр ничего нет.</div>"
        return

    # выбираем без повторов внутри пула
    candidates = [j for j in pool if j not in used]
    if not candidates:
        used.clear()
        candidates = pool

    setup, punch, tag = random.choice(candidates)
    used.add((setup, punch, tag))
    final = random.choice(ФИНАЛЬНЫЙ_БЛОК)
    counter += 1

    box.innerHTML = (
        f"<div class='setup'>{setup}</div>"
        f"<div class='punch'>{punch}</div>"
        f"<div style='color:#888; margin-top:16px; font-style:italic;'>{final}</div>"
        f"<span class='tag'>#{tag}</span>"
    )
    cnt.innerText = (
        f"Сгенерировано: {counter} | "
        f"В базе: {len(BASE)} шуток | "
        f"В категории: {len(pool)}"
    )

# Инициализация счётчика при загрузке
document.getElementById("counter").innerText = (
    f"Загружено {len(BASE)} шуток в {len(CATEGORIES)} категориях. Нажми кнопку."
